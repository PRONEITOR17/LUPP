<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0C">
  <meta name="description" content="LUPP: tu dinero y tu tiempo en un solo lugar">
  <title>LUPP</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Aplica el tema antes de dibujar para que no parpadee
    try {
      var t = localStorage.getItem('lupp:tema') || 'oscuro';
      if (t === 'sistema') t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'oscuro';
      document.documentElement.dataset.tema = t;
    } catch (e) {
      document.documentElement.dataset.tema = 'oscuro';
    }
  </script>
</head>
<body>
  <div id="app"><main class="login"><h1 class="logo grande">LUPP</h1><p class="sub">Cargando…</p></main></div>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
